services:

  redis:
    image: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mongo:
    image: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  api:
    image: notification-system
    ports:
      - "3000:3000"
    environment:
      REDIS_HOST: redis
      MONGO_URI: mongodb://mongo:27017/notification-system
    depends_on:
      redis:
        condition: service_healthy

  worker:
    image: notification-system
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      MONGO_URI: mongodb://mongo:27017/notification-system
    command: node src/worker.js

volumes:
  redis-data:
  mongo-data: